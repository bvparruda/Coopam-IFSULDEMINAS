<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicial</title>
    <link rel="icon" href="img/coopam.png" type="image/x-icon">

    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/index.css">
    <link rel="stylesheet" href="css/formulario.css">
</head>
<body>
    <!-- Cabeçalho -->
    <header> 
        <!-- Nav bar -->
        <nav class="navbar">
            <!-- Logo -->
            <div class="logo"><img src="img/coopam.png" alt="Logo da Coopam"></div> 
            <!-- Links -->
            <ul class="nav-links">
                <li><a href="index.html">Inicio</a></li>
                <li><a href="tabela.html">Tabela</a></li>
                <li><a href="formulario.html">Formulário</a></li>
                <li><a href="sobre.html">Sobre</a></li>
            </ul>
        </nav>
    </header>

    <form id="form-cliente">
        <label for="nome_cliente">Nome: </label>
        <input type="text" id="nome_cliente" name="nome_cliente" required>

        <label for="email">Email: </label>
        <input type="email" id="email" name="email" required>

        <label for="idade">Idade: </label>
        <input type="number" id="idade" name="idade" required>

        <label for="data">Data da compra do produto: </label>
        <input type="date" id="data" name="data" required>

        <label for="avaliacao">Avaliacao do cliente: </label>
        <input type="text" id="avaliacao" name="avaliacao" required>

        <!-- BOTÕES LADO A LADO -->
        <div class="botoes-form-cliente">
            <button type="submit">Enviar</button>
            <button type="button" id="btn-baixar-json">Baixar JSON</button>
            <a href="index.html" class="botao-voltar">Voltar</a>
        </div>
    </form>

    <p class="mensagem" id="mensagem"></p>

    <script>
        const CHAVE_STORAGE = "clientes";

        const form = document.getElementById("form-cliente");
        const mensagem = document.getElementById("mensagem");
        const btnBaixarJson = document.getElementById("btn-baixar-json");

        // Lê a lista atual de clientes guardada no localStorage
        function obterClientes() {
            const dados = localStorage.getItem(CHAVE_STORAGE);
            return dados ? JSON.parse(dados) : [];
        }

        // Salva a lista de clientes de volta no localStorage
        function salvarClientes(clientes) {
            localStorage.setItem(CHAVE_STORAGE, JSON.stringify(clientes, null, 4));
        }

        // Evento de envio do formulário
        form.addEventListener("submit", function (evento) {
            evento.preventDefault();

            const nome_cliente = document.getElementById("nome_cliente").value.trim();
            const email        = document.getElementById("email").value.trim();
            const idade        = document.getElementById("idade").value.trim();
            const data         = document.getElementById("data").value.trim();
            const avaliacao    = document.getElementById("avaliacao").value.trim();

            if (!nome_cliente || !email || !idade || !data || !avaliacao) {
                mensagem.textContent = "Por favor, preencha todos os campos.";
                return;
            }

            const novoCliente = {
                id: Date.now().toString(),
                nome_cliente,
                email,
                idade,
                data_compra: data,
                avaliacao,
                data_cadastro: new Date().toLocaleString("pt-BR")
            };

            const clientes = obterClientes();
            clientes.push(novoCliente);
            salvarClientes(clientes);

            mensagem.textContent = "Cliente cadastrado com sucesso!";
            form.reset();
        });

        // Botão para baixar todos os dados como arquivo clientes.json
        btnBaixarJson.addEventListener("click", function () {
            const clientes = obterClientes();

            if (clientes.length === 0) {
                mensagem.textContent = "Nenhum cliente cadastrado ainda.";
                return;
            }

            const conteudo = JSON.stringify(clientes, null, 4);
            const blob = new Blob([conteudo], { type: "application/json" });
            const url = URL.createObjectURL(blob);

            const link = document.createElement("a");
            link.href = url;
            link.download = "clientes.json";
            link.click();

            URL.revokeObjectURL(url);
        });
    </script>
</body>
</html>
